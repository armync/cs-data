apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentbit
  namespace: logging
  labels:
    app: fluentbit
spec:
  selector:
    matchLabels:
      app: fluentbit

  template:
    metadata:
      labels:
        app: fluentbit
    spec:
      serviceAccountName: fluentbit
      terminationGracePeriodSeconds: 10

      containers:
        - name: fluentbit
          image: cr.fluentbit.io/fluent/fluent-bit:3.0.7
          imagePullPolicy: IfNotPresent

          env:
            - name: ES_USER
              valueFrom:
                secretKeyRef:
                  name: es-auth
                  key: username
            - name: ES_PASS
              valueFrom:
                secretKeyRef:
                  name: es-auth
                  key: password

          args: # passes the command flag to start he FLuent Bit engine using the config file (set through configmap)
            - -c
            - /fluent-bit/etc/fluent-bit.conf

          ports:
            - name: http
              containerPort: 2020 # fluentbit port declaration for monitoring and management

          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 300Mi

          volumeMounts:
            - name: fluentbit-config
              mountPath: /fluent-bit/etc/

            # mirror the /var/log/ folder from server inside the fluent bit
            - name: varlog
              mountPath: /var/log
              readOnly: true

      volumes:
        - name: fluentbit-config
          configMap:
            name: fluentbit-config

        - name: varlog
          hostPath:
            path: /var/log
