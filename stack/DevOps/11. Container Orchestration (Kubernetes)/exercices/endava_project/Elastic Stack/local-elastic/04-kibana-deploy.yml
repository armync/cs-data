apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          # image: kibana:8.19.12 # same as elasticsearch
          image: docker.elastic.co/kibana/kibana:8.19.12 # official

          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200 # where to find at

            - name: ELASTICSEARCH_SERVICEACCOUNTTOKEN
              valueFrom:
                secretKeyRef:
                  name: kibana-es-token
                  key: token

            - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY # Encrypts sensitive credentials, such as API keys and passwords, stored within Kibana's saved objects.
              valueFrom:
                secretKeyRef:
                  name: kibana-enc-keys
                  key: xpack_encryptedSavedObjects_encryptionKey

            - name: XPACK_REPORTING_ENCRYPTIONKEY # Secures background task data and session states when Kibana generates automated reports like PDFs or CSVs.
              valueFrom:
                secretKeyRef:
                  name: kibana-enc-keys
                  key: xpack_reporting_encryptionKey

            - name: XPACK_SECURITY_ENCRYPTIONKEY # Encrypts user login session cookies to keep users securely authenticated across all your Kibana instances.
              valueFrom:
                secretKeyRef:
                  name: kibana-enc-keys
                  key: xpack_security_encryptionKey

            #- name: ELASTICSEARCH_USERNAME
            #  valueFrom:
            #    secretKeyRef:
            #      name: es-auth
            #      key: username
            #- name: ELASTICSEARCH_PASSWORD
            #  valueFrom:
            #    secretKeyRef:
            #      name: es-auth
            #      key: password

          ports:
            - name: http
              containerPort: 5601 # not opened, just a documentation

          volumeMounts:
            - name: kibana-config-volume
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml # mount just this, don't replace everything already there

            #  - name: es-http-ca-vol
            #    mountPath: /usr/share/kibana/config/certs
            #    readOnly: true # just read the cert, don't alter it

      volumes:
        - name: kibana-config-volume # logical volume
          configMap:
            name: kibana-config # find the named resource configMap and copy it in volume


        # - name: es-http-ca-vol
        #   secret:
        #     secretName: es-http-ca

# template at https://medium.com/@ismailwajdi39/deploying-elasticsearch-and-kibana-on-kubernetes-with-password-protection-fad93010563c
