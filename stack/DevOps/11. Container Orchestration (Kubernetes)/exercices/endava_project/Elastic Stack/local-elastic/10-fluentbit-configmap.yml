apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
      Flush 1
      Log_Level info
      Parsers_File parsers.conf

    [INPUT]
      Name tail
      Path /var/log/containers/*.log
      Tag kube.*
      Parser cri
      Mem_Buf_Limit 10MB
      Skip_Long_Lines On

    [FILTER]
      Name kubernetes
      Match kube.*
      Merge_Log On
      Keep_Log Off

    [OUTPUT]
      Name es
      Match kube.*
      Host elasticsearch.logging.svc
      Port 9200
      HTTP_User ${ES_USER}
      HTTP_Passwd ${ES_PASS}
      Logstash_Format On
      Logstash_Prefix petclinic
      Suppress_Type_Name On

  parsers.conf: |
    [PARSER]
      Name cri
      Format regex
      Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
      Time_Key time
      Time_Format %Y-%m-%dT%H:%M:%S.%L%z

