apiVersion: v1
kind: Service
metadata:
  name: dragon-service
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: wooferius
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      # By default and for convenience, the Kubernetes control plane will allocate a port from a range (default: 30000-32767)
      nodePort: 30010