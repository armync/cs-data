---
- name: Bootstrap devops access and key
  hosts: web
  become: true
  vars:
    controller_pubkey: "{{ lookup('file', lookup('env','HOME') + '/.ssh/ansible.pub') }}"
  tasks:
    - name: Ensure devops group exists
      ansible.builtin.group:
        name: devops
        state: present

    - name: Ensure ansible user exists and is in devops
      ansible.builtin.user:
        name: ansible
        state: present
        groups: devops
        append: true
        shell: /bin/bash
        create_home: true

    - name: Ensure .ssh directory exists for ansible user
      ansible.builtin.file:
        path: /home/ansible/.ssh
        state: directory
        owner: ansible
        group: ansible
        mode: "0700"

    - name: Passwordless sudo for devops
      ansible.builtin.copy:
        dest: /etc/sudoers.d/devops
        content: "%devops ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Ensure controller public key in ansible's authorized_keys
      ansible.builtin.authorized_key:
        user: ansible
        state: present
        key: "{{ controller_pubkey }}"
